<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shared Notes</title>

  <!-- Phone / home-screen app -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Notes">
  <meta name="format-detection" content="telephone=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside>
      <div class="brand">
        <h1>Notes</h1>
        <button class="new" id="newBtn" disabled>+ New</button>
      </div>
      <input class="search" id="search" placeholder="Search notes" autocomplete="off">
      <div class="list" id="list"><div class="empty-list">Loading notes…</div></div>
      <button class="trash-link" id="trashBtn">Trash</button>
      <div class="footer">
        <div class="status"><span class="dot" id="dot"></span><span id="conn">Connecting…</span></div>
        <button class="me" id="meBtn" title="Change your name"></button>
      </div>
    </aside>

    <main>
      <div class="banner" id="banner"></div>
      <div class="toolbar" id="toolbar" hidden>
        <button class="back" id="backBtn">‹ Notes</button>
        <span class="saved" id="saved"></span>
        <button class="tb" id="pinBtn">Pin</button>
        <button class="tb del" id="delBtn">Delete</button>
        <button class="tb on" id="restoreBtn" hidden>Restore</button>
      </div>
      <div class="editor" id="editorWrap" hidden>
        <div class="inner">
          <input class="title" id="title" placeholder="Untitled" maxlength="200">
          <div class="meta" id="meta"></div>
          <textarea class="body" id="body" placeholder="Start writing…" maxlength="100000"></textarea>
        </div>
      </div>
      <div class="placeholder" id="placeholder">
        <h2>Pick a note or start a new one</h2>
        <div>Everything saves on its own and shows up for everyone instantly.</div>
      </div>
    </main>
  </div>

  <div class="modal" id="modal">
    <form class="card" id="modalCard">
      <h3 id="modalTitle"></h3>
      <p id="modalText"></p>
      <input class="field" id="modalInput" maxlength="40" autocomplete="off" hidden>
      <div class="error" id="modalError" hidden></div>
      <div class="row">
        <button type="button" class="btn" id="modalCancel">Cancel</button>
        <button type="submit" class="btn primary" id="modalOk">OK</button>
      </div>
    </form>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
